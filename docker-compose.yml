services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-prog4}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-prog4}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - '3001:3000'
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER:-prog4}:${MONGO_PASSWORD:-prog4}@mongo:27017/redsocial?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
