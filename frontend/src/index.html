<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Banquete</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('tema');
          if (tema !== 'claro' && tema !== 'oscuro') {
            tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          document.documentElement.dataset.tema = tema;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,600;0,8..144,900;1,8..144,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
