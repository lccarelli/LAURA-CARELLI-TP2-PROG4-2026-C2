@if (auth.usuario()) {
  <div class="barra-superior" [class.oculta]="!desplazamiento.mostrar()">
    @if (conBuscador()) {
      <app-buscador
        class="buscador-barra"
        [valor]="q()"
        [descripcion]="descripcion()"
        (buscar)="buscar($event)"
      />
    }
    <app-campanita class="ml-auto" />
  </div>
}
