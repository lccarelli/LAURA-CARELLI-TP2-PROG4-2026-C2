<div class="velo">
  <div
    class="ventana"
    [class.ventana-completa]="completa()"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-label]="titulo() | translate"
  >
    <header class="ventana-cabecera" [class.ventana-cabecera-flota]="completa()">
      @if (!completa()) {
        <h2 class="titulo-tarjeta">{{ titulo() | translate }}</h2>
      }
      <button
        type="button"
        class="boton-icono"
        [attr.aria-label]="'comun.cerrar' | translate"
        (click)="cerrar.emit()"
      >
        <svg
          class="icono"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>
    <ng-content />
  </div>
</div>
