<article class="tarjeta p-4 md:p-5">
  <header class="mb-3 flex items-center gap-3">
    <img
      class="size-11 rounded-full object-cover"
      [src]="urlImagen(publicacion().usuario.imagenPerfil)"
      [alt]="'Foto de ' + publicacion().usuario.nombreUsuario"
    />
    <div>
      <p class="font-medium">
        {{ publicacion().usuario.nombre }} {{ publicacion().usuario.apellido }}
        <span class="text-sm font-normal text-slate-500"
          >&#64;{{ publicacion().usuario.nombreUsuario }}</span
        >
      </p>
      <p class="text-xs text-slate-500">{{ publicacion().fecha | date: 'dd/MM/yyyy HH:mm' }}</p>
    </div>
  </header>

  <h2 class="text-xl font-semibold italic">{{ publicacion().titulo }}</h2>
  <p class="mt-1 whitespace-pre-line text-slate-700">{{ publicacion().mensaje }}</p>

  @if (publicacion().imagen; as imagen) {
    <img
      class="mt-3 max-h-96 w-full rounded-2xl object-cover"
      [src]="urlImagen(imagen)"
      [alt]="publicacion().titulo"
    />
  }
</article>
