<button type="button" class="pin" (click)="abrir.emit()">
  @if (publicacion().imagen; as imagen) {
    <img class="pin-imagen" [src]="urlImagen(imagen)" alt="" />
  } @else {
    <span class="pin-texto">{{ publicacion().mensaje }}</span>
  }
  <span class="pin-pie">
    <span class="pin-tipo">{{ 'tipos.' + publicacion().tipo | translate }}</span>
    <span class="pin-titulo">{{ publicacion().titulo }}</span>
    <span class="pin-autor">
      <img
        class="avatar-chico"
        [src]="urlImagen(publicacion().usuario.imagenPerfil)"
        [alt]="'comun.foto_de' | translate: { nombre: publicacion().usuario.nombreUsuario }"
      />
      &#64;{{ publicacion().usuario.nombreUsuario }}
    </span>
    <span class="metricas">
      <span
        class="metrica"
        [attr.aria-label]="
          'publicaciones.me_gusta' | translate: { n: publicacion().cantidadMeGusta }
        "
      >
        <svg
          class="icono-chico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
        </svg>
        <span aria-hidden="true">{{ publicacion().cantidadMeGusta }}</span>
      </span>
      <span
        class="metrica"
        [attr.aria-label]="
          'publicaciones.comentarios' | translate: { n: publicacion().cantidadComentarios }
        "
      >
        <svg
          class="icono-chico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 5h16v11H9l-5 4V5z" />
        </svg>
        <span aria-hidden="true">{{ publicacion().cantidadComentarios }}</span>
      </span>
    </span>
  </span>
</button>
