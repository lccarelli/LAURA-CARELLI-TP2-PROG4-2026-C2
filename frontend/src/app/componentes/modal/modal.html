<div class="velo">
  <div class="dialogo" role="dialog" aria-modal="true" [attr.aria-label]="titulo() | translate">
    <h2 class="titulo-tarjeta mb-2">{{ titulo() | translate }}</h2>
    <p class="mb-6 whitespace-pre-line"><ng-content /></p>
    <div class="acciones">
      <button type="button" class="boton-principal w-full" (click)="cerrar.emit()">
        {{ 'comun.aceptar' | translate }}
      </button>
    </div>
  </div>
</div>
