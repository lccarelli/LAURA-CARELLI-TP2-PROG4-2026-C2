<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm"
>
  <div
    class="tarjeta w-full max-w-md bg-white/90 p-6 shadow-xl"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="titulo()"
  >
    <h2 class="mb-2 text-xl font-semibold italic">{{ titulo() }}</h2>
    <p class="mb-6 whitespace-pre-line text-slate-700"><ng-content /></p>
    <button type="button" class="boton-principal" (click)="cerrar.emit()">Aceptar</button>
  </div>
</div>
