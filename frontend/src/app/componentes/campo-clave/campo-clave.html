<div class="campo-clave">
  <ng-content />
  <button
    type="button"
    class="boton-ojo"
    [attr.aria-label]="(visible() ? 'comun.ocultar_clave' : 'comun.ver_clave') | translate"
    [attr.aria-pressed]="visible()"
    (click)="alternar()"
  >
    <app-icono [nombre]="visible() ? 'ojo_tachado' : 'ojo'" />
  </button>
</div>
