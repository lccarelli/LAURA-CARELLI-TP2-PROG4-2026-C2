<div class="campo-clave">
  <ng-content />
  <button
    type="button"
    class="boton-ojo"
    [attr.aria-label]="(visible() ? 'comun.ocultar_clave' : 'comun.ver_clave') | translate"
    [attr.aria-pressed]="visible()"
    (click)="alternar()"
  >
    @if (visible()) {
      <svg
        class="icono"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 3l18 18" />
        <path
          d="M10.6 6.2A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 4M6.5 6.9C3.9 8.6 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1"
        />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </svg>
    } @else {
      <svg
        class="icono"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
