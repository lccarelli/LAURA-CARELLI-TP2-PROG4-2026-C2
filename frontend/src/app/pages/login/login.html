<div inert>
  <app-inicio />
</div>

<app-ventana titulo="login.titulo" [escape]="!mensajeModal()" (cerrar)="cerrar()">
  <div>
    <p class="texto-suave mb-6">{{ 'login.saludo' | translate }}</p>

    <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <label class="block">
        <span class="etiqueta">{{ 'login.identificador' | translate }}</span>
        <input class="campo" formControlName="identificador" autocomplete="username" />
        @if (mensajeDeError('identificador'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <label class="block">
        <span class="etiqueta">{{ 'login.clave' | translate }}</span>
        <app-campo-clave>
          <input
            class="campo"
            type="password"
            formControlName="clave"
            autocomplete="current-password"
          />
        </app-campo-clave>
        @if (mensajeDeError('clave'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <button type="submit" class="boton-principal w-full" [disabled]="enviando()">
        {{ (enviando() ? 'login.boton_enviando' : 'login.boton') | translate }}
      </button>
    </form>

    <p class="pie-formulario">
      {{ 'login.sin_cuenta' | translate }}
      <a class="enlace" routerLink="/registro">{{ 'login.registrarme' | translate }}</a>
    </p>
  </div>
</app-ventana>

@if (mensajeModal(); as mensaje) {
  <app-modal titulo="login.error_titulo" (cerrar)="mensajeModal.set(null)">{{
    mensaje | translate
  }}</app-modal>
}
