<section class="acceso">
  <app-panel-publicaciones />

  <div class="acceso-formulario">
    <h1 class="titulo">{{ 'login.titulo' | translate }}</h1>

    @if (motivoDeSalida(); as motivo) {
      <app-aviso
        titulo="login.sesion_cerrada_titulo"
        [info]="true"
        (cerrar)="motivoDeSalida.set(null)"
        >{{ motivo | translate }}</app-aviso
      >
    }

    @if (mensajeError(); as mensaje) {
      <app-aviso titulo="login.error_titulo" (cerrar)="mensajeError.set(null)">{{
        mensaje | translate
      }}</app-aviso>
    }

    <div>
      <p class="texto-suave mb-6">{{ 'login.saludo' | translate }}</p>

      <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
        <label class="caja">
          <span class="etiqueta">{{ 'login.identificador' | translate }}</span>
          <input
            appAutoFoco
            class="campo"
            formControlName="identificador"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
          />
          @if (mensajeDeError('identificador'); as mensaje) {
            <span class="mensaje-error">{{ mensaje }}</span>
          }
        </label>

        <label class="caja">
          <span class="etiqueta">{{ 'login.clave' | translate }}</span>
          <app-campo-clave>
            <input
              class="campo"
              type="password"
              formControlName="clave"
              autocomplete="current-password"
            />
          </app-campo-clave>
          @if (mensajeDeError('clave'); as mensaje) {
            <span class="mensaje-error">{{ mensaje }}</span>
          }
        </label>

        <button type="submit" class="boton-principal w-full" [disabled]="enviando()">
          {{ (enviando() ? 'login.boton_enviando' : 'login.boton') | translate }}
        </button>
      </form>

      <p class="pie-formulario">
        {{ 'login.sin_cuenta' | translate }}
        <a class="enlace" routerLink="/registro">{{ 'login.registrarme' | translate }}</a>
      </p>
    </div>
  </div>
</section>
