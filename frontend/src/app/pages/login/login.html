<section class="mx-auto flex min-h-[80vh] max-w-md items-center p-4">
  <div class="tarjeta w-full p-6 md:p-8">
    <h1 class="titulo">Ingresar</h1>
    <p class="mt-1 mb-6 text-slate-600">Qué bueno verte de nuevo.</p>

    <form class="space-y-4" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <label class="block">
        <span class="etiqueta">Correo o nombre de usuario</span>
        <input class="campo" formControlName="identificador" autocomplete="username" />
        @if (mensajeDeError('identificador'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <label class="block">
        <span class="etiqueta">Clave</span>
        <input
          class="campo"
          type="password"
          formControlName="clave"
          autocomplete="current-password"
        />
        @if (mensajeDeError('clave'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <button type="submit" class="boton-principal" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm">
      ¿No tenés cuenta? <a class="font-medium underline" routerLink="/registro">Registrarme</a>
    </p>
  </div>
</section>

@if (mensajeModal(); as mensaje) {
  <app-modal titulo="No se pudo ingresar" (cerrar)="mensajeModal.set(null)">{{
    mensaje
  }}</app-modal>
}
