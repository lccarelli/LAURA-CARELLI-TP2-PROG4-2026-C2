<section class="pagina-ancha">
  <h1 class="texto-oculto">{{ 'publicaciones.titulo' | translate }}</h1>

  <app-muro-publicaciones [consulta]="busqueda()" [tipoElegido]="tipo()" [ordenElegido]="orden()" />
</section>

<a class="boton-flotante" routerLink="/publicaciones/nueva">
  <svg
    class="icono"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <path d="M12 5v14M5 12h14" />
  </svg>
  <span class="texto-de-escritorio">{{ 'publicaciones.crear' | translate }}</span>
</a>
