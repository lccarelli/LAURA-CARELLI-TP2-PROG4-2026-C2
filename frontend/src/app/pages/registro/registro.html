<section class="mx-auto flex min-h-[85vh] max-w-lg items-center p-4">
  <div class="tarjeta w-full p-6 md:p-8">
    <h1 class="titulo">Crear cuenta</h1>
    <p class="mt-1 mb-6 text-slate-600">Unite y empezá a compartir tus momentos.</p>

    <form class="space-y-4" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <div class="grid grid-cols-2 gap-4">
        <label class="block">
          <span class="etiqueta">Nombre</span>
          <input class="campo" formControlName="nombre" autocomplete="given-name" />
          @if (mensajeDeError('nombre'); as mensaje) {
            <span class="mensaje-error">{{ mensaje }}</span>
          }
        </label>
        <label class="block">
          <span class="etiqueta">Apellido</span>
          <input class="campo" formControlName="apellido" autocomplete="family-name" />
          @if (mensajeDeError('apellido'); as mensaje) {
            <span class="mensaje-error">{{ mensaje }}</span>
          }
        </label>
      </div>

      <label class="block">
        <span class="etiqueta">Correo</span>
        <input class="campo" type="email" formControlName="correo" autocomplete="email" />
        @if (mensajeDeError('correo'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <label class="block">
        <span class="etiqueta">Nombre de usuario</span>
        <input class="campo" formControlName="nombreUsuario" autocomplete="username" />
        @if (mensajeDeError('nombreUsuario'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <div class="grid grid-cols-2 gap-4">
        <label class="block">
          <span class="etiqueta">Clave</span>
          <input
            class="campo"
            type="password"
            formControlName="clave"
            autocomplete="new-password"
          />
          @if (mensajeDeError('clave'); as mensaje) {
            <span class="mensaje-error">{{ mensaje }}</span>
          }
        </label>
        <label class="block">
          <span class="etiqueta">Repetir clave</span>
          <input
            class="campo"
            type="password"
            formControlName="repetirClave"
            autocomplete="new-password"
          />
          @if (mensajeDeError('repetirClave'); as mensaje) {
            <span class="mensaje-error">{{ mensaje }}</span>
          }
        </label>
      </div>

      <label class="block">
        <span class="etiqueta">Fecha de nacimiento</span>
        <input class="campo" type="date" formControlName="fechaNacimiento" [max]="hoy" />
        @if (mensajeDeError('fechaNacimiento'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <label class="block">
        <span class="etiqueta">Descripción breve</span>
        <textarea class="campo" rows="3" formControlName="descripcion"></textarea>
        @if (mensajeDeError('descripcion'); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <label class="block">
        <span class="etiqueta">Imagen de perfil (opcional)</span>
        <input
          class="mt-1 w-full text-sm file:mr-3 file:rounded-full file:border-0 file:bg-white/80 file:px-4 file:py-2 file:font-medium"
          type="file"
          accept="image/*"
          (change)="elegirImagen($event)"
        />
        @if (errorImagen(); as mensaje) {
          <span class="mensaje-error">{{ mensaje }}</span>
        }
      </label>

      <button type="submit" class="boton-principal" [disabled]="enviando()">
        {{ enviando() ? 'Creando cuenta…' : 'Registrarme' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm">
      ¿Ya tenés cuenta? <a class="font-medium underline" routerLink="/login">Ingresar</a>
    </p>
  </div>
</section>

@if (mensajeModal(); as mensaje) {
  <app-modal titulo="No se pudo crear la cuenta" (cerrar)="mensajeModal.set(null)">{{
    mensaje
  }}</app-modal>
}
