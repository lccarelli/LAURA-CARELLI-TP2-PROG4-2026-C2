<section class="acceso">
  <app-mosaico-comidas />

  <div class="acceso-formulario">
    <h1 class="titulo">{{ 'registro.titulo' | translate }}</h1>

    @if (mensajeError(); as mensaje) {
      <app-aviso titulo="registro.error_titulo" (cerrar)="mensajeError.set(null)">{{
        mensaje | translate
      }}</app-aviso>
    }

    <div>
      <p class="texto-suave mb-6">{{ 'registro.saludo' | translate }}</p>

      <app-formulario-usuario
        boton="registro.boton"
        botonEnviando="registro.boton_enviando"
        [enviando]="enviando()"
        (guardar)="registrar($event)"
      />

      <p class="pie-formulario">
        {{ 'registro.con_cuenta' | translate }}
        <a class="enlace" routerLink="/login">{{ 'registro.ingresar' | translate }}</a>
      </p>
    </div>
  </div>
</section>
